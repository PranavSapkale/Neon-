<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON NOTES</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script></head>
<body><div class="scanlines"></div><header><div class="brand glitch" data-text="NEON//NOTES">NEON//NOTES</div><label class="upload">UPLOAD <input id="upload" type="file" accept=".txt,.md,.docx"></label><button id="build">BUILD PAGE</button><button id="save">SAVE</button><button id="export">EXPORT HTML</button><select id="theme"><option value="cyan">CYAN/MAGENTA</option><option value="toxic">TOXIC GREEN</option><option value="red">RED ALERT</option><option value="violet">VIOLET SYNTH</option></select><button id="mute">SOUND ON</button><input id="search" placeholder="SEARCH PAGE"></header>
<main><aside class="sidebar"><h2>ARCHIVE</h2><div id="notes"></div></aside><section class="editor-panel"><input id="note-title" placeholder="NOTE TITLE"><textarea id="editor" spellcheck="true" placeholder="Paste raw notes here..."></textarea><div class="editor-foot"><span id="word-count">0 WORDS</span><span id="save-status">SYNCED</span></div></section><section class="workspace"><div class="tabs"><button class="active" data-tab="structured">STRUCTURED PAGE</button><button data-tab="flashcards">FLASHCARDS</button><button data-tab="versions">VERSION HISTORY</button></div><div id="structured" class="tab-panel active"><div id="page"></div></div><div id="flashcards" class="tab-panel"></div><div id="versions" class="tab-panel"></div></section></main>
<script src="parser.js"></script><script src="sound.js"></script><script src="flashcards.js"></script><script src="app.js"></script></body></html>
